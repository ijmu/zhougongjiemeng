<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a14">
<title>未找到此页 · 周公解梦</title>
<style>
:root{--bg:#080a14;--gold:#d9b877;--gold2:#f4e0b0;--dim:#9aa0bd;--dim2:#7d84a4;
--ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
--ffs:"Songti SC","STSong","Noto Serif SC",serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:#e6e8f2;font-family:var(--ff);
display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:24px;min-height:100vh;
background-image:
  radial-gradient(46% 32% at 50% 0%,rgba(125,212,225,.12),transparent 70%),
  radial-gradient(42% 30% at 86% 58%,rgba(157,140,224,.11),transparent 70%)}
.m{font-size:44px;filter:drop-shadow(0 0 18px rgba(217,184,119,.5))}
h1{margin:16px 0 0;font-family:var(--ffs);font-size:24px;font-weight:700;letter-spacing:.16em;color:var(--gold2)}
p{margin:12px 0 0;font-size:13.5px;line-height:1.8;color:var(--dim);max-width:340px}
a{margin-top:24px;display:inline-flex;align-items:center;justify-content:center;
min-height:46px;padding:0 26px;border-radius:11px;text-decoration:none;
font-family:var(--ffs);font-size:15px;font-weight:700;letter-spacing:.16em;
color:#14101a;background:linear-gradient(135deg,#b8f0e4,#7fd4c1 45%,#d9b877 120%)}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim2);
background:rgba(255,255,255,.05);padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
  <div class="m">🌫️</div>
  <h1>此路不通</h1>
  <p>你找的这一页不在梦书里。<br>可能是链接抄错，也可能是它在雾里散了。</p>
  <p><code id="p"></code></p>
  <a href="/">回到解梦首页</a>
<script>try{document.getElementById('p').textContent=location.pathname}catch(e){}</script>
</body>
</html>
